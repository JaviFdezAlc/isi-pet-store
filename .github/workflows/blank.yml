name: pet-store-tests
on: [ push, pull_request ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install curl
      run: sudo apt-get update && sudo apt-get install -y curl

    - name: Start API
      # Adapting to your root app.py; change if needed
      run: |
        # setup DB if appropriate
        if [ -f setup_database.py ]; then python setup_database.py; fi
        if [ -f populate_database.py ]; then python populate_database.py; fi

        # Run the main app on background
        python app.py &
        sleep 5 # give it time to start

    - name: Run Integration Tests (verify_api.sh)
      run: |
        chmod +x verify_api.sh
        ./verify_api.sh
